<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aria</title>
<style>html,body{margin:0;height:100%;background:#0e0f13;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}</style>
</head>
<body>
<canvas id="aria-canvas"></canvas>
<script type="module">
import init, { start } from "/pkg/aria.js";
try {
  await init();
  await start("aria-canvas");
  console.log("aria: started");
} catch (error) {
  console.error("aria: failed", error);
}
</script>
</body>
</html>
