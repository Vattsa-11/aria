<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aria</title>
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aria">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="/gate.js"></script>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
let installPrompt = null;
window.addEventListener("beforeinstallprompt", (event) => { event.preventDefault(); installPrompt = event; });
window.addEventListener("appinstalled", () => { installPrompt = null; });
window.ariaInstallState = () => {
  if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) return "installed";
  if (installPrompt) return "available";
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ? "ios" : "browser";
};
window.ariaStorageRefresh = async () => {
  try {
    const estimate = await navigator.storage.estimate();
    const persisted = await navigator.storage.persisted();
    window.__ariaStorage = JSON.stringify({ usage: estimate.usage || 0, quota: estimate.quota || 0, persisted });
  } catch {}
};
window.ariaRequestPersist = async () => {
  try {
    const granted = await navigator.storage.persist();
    await window.ariaStorageRefresh();
    return granted;
  } catch { return false; }
};
if (navigator.storage?.persist) {
  navigator.storage.persist().finally(() => window.ariaStorageRefresh());
  setInterval(() => window.ariaStorageRefresh(), 5000);
}
(function () {
  window.__ariaMedia = [];
  window.__ariaDuration = 0;
  const session = "mediaSession" in navigator ? navigator.mediaSession : null;
  window.ariaMediaTrack = (title, artist, art, duration) => {
    if (!session) return;
    window.__ariaDuration = Number(duration) || 0;
    const artwork = art ? [{ src: new URL("/api/image?u=" + encodeURIComponent(art), location.origin).href, sizes: "512x512" }] : [];
    try { session.metadata = new MediaMetadata({ title, artist, album: "Aria", artwork }); } catch {}
  };
  window.ariaMediaState = (playing, position) => {
    if (!session) return;
    session.playbackState = playing ? "playing" : "paused";
    try {
      if (window.__ariaDuration > 0) session.setPositionState({ duration: window.__ariaDuration, position: Math.min(Math.max(Number(position) || 0, 0), window.__ariaDuration), playbackRate: 1 });
    } catch {}
  };
  window.ariaMediaStop = () => {
    if (!session) return;
    session.playbackState = "none";
    try { session.metadata = null; } catch {}
  };
  if (session) {
    for (const [name, tag] of [["play", "play"], ["pause", "pause"], ["previoustrack", "previous"], ["nexttrack", "next"], ["stop", "stop"]]) {
      try { session.setActionHandler(name, () => { window.__ariaMedia.push(tag); window.ariaWake?.(); }); } catch {}
    }
    try { session.setActionHandler("seekto", (details) => { window.__ariaMedia.push("seek:" + details.seekTime); window.ariaWake?.(); }); } catch {}
  }
  window.ariaTakeMedia = () => { const items = window.__ariaMedia; window.__ariaMedia = []; return items.join(","); };
})();
(function () {
  let depth = 1;
  let ignore = 0;
  let back = 0;
  let atBase = false;
  let exitTimer = null;
  try { history.replaceState({ aria: 0 }, ""); history.pushState({ aria: 1 }, ""); } catch {}
  window.addEventListener("popstate", () => {
    if (ignore > 0) { ignore--; return; }
    const to = history.state && typeof history.state.aria === "number" ? history.state.aria : 0;
    if (to < depth) back += depth - to;
    depth = to;
    atBase = to === 0;
    window.ariaWake?.();
  });
  window.ariaTakeBack = () => { const n = back; back = 0; return n; };
  window.ariaSyncLayers = (layers) => {
    const target = 1 + Number(layers);
    if (atBase) {
      if (target === 1) return;
      clearTimeout(exitTimer);
      history.pushState({ aria: 1 }, "");
      depth = 1;
      atBase = false;
    }
    while (depth < target) { depth++; history.pushState({ aria: depth }, ""); }
    if (depth > target) { ignore++; history.go(target - depth); depth = target; }
  };
  window.ariaArmExit = () => {
    clearTimeout(exitTimer);
    exitTimer = setTimeout(() => {
      if (atBase) { history.pushState({ aria: 1 }, ""); depth = 1; atBase = false; }
    }, 2500);
  };
})();
let loadedBuild = null;
window.__ariaUpdate = false;
async function checkVersion() {
  try {
    const response = await fetch("/version.json", { cache: "no-store" });
    const { build } = await response.json();
    if (loadedBuild === null) loadedBuild = build;
    else if (build !== loadedBuild) {
      window.__ariaUpdate = true;
      window.ariaWake?.();
      navigator.serviceWorker?.getRegistration().then((registration) => registration?.update());
    }
  } catch {}
}
checkVersion();
setInterval(checkVersion, 10 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
window.ariaUpdateReady = () => window.__ariaUpdate === true;
window.ariaApplyUpdate = () => location.reload();
(function () {
  const info = { state: "idle", position: 0, duration: 0, error: 0 };
  window.__ariaYT = info;
  let player = null;
  let api = null;
  const ready = () => (api ||= new Promise((resolve) => {
    if (window.YT && window.YT.Player) return resolve();
    window.onYouTubeIframeAPIReady = resolve;
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.append(tag);
  }));
  const box = () => {
    let element = document.getElementById("aria-yt-box");
    if (element) return element;
    element = document.createElement("div");
    element.id = "aria-yt-box";
    element.style.cssText = "position:fixed;right:12px;bottom:132px;width:200px;z-index:9998;background:#000;border:1px solid #262a33;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.6)";
    const bar = document.createElement("div");
    bar.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 6px 4px 10px;background:#16181e;color:#9aa0ab;font:12px system-ui";
    const label = document.createElement("span");
    label.textContent = "YouTube";
    const buttons = document.createElement("span");
    const style = "background:#262a33;color:#fff;border:0;border-radius:8px;padding:5px 9px;font:600 12px system-ui;cursor:pointer;margin-left:4px";
    const grow = document.createElement("button");
    grow.textContent = "Expand";
    grow.style.cssText = style;
    let large = false;
    grow.onclick = () => {
      large = !large;
      element.style.width = large ? "min(460px, calc(100vw - 24px))" : "200px";
      element.style.right = large ? "50%" : "12px";
      element.style.transform = large ? "translateX(50%)" : "none";
      slot.style.aspectRatio = large ? "16/9" : "1/1";
      grow.textContent = large ? "Shrink" : "Expand";
    };
    const close = document.createElement("button");
    close.textContent = "Close";
    close.style.cssText = style.replace("#262a33", "#4f8cff");
    close.onclick = () => window.ariaYTStop();
    buttons.append(grow, close);
    bar.append(label, buttons);
    const slot = document.createElement("div");
    slot.id = "aria-yt-slot";
    slot.style.cssText = "width:100%;aspect-ratio:1/1";
    element.append(bar, slot);
    document.body.append(element);
    return element;
  };
  const names = { "-1": "buffering", 0: "ended", 1: "playing", 2: "paused", 3: "buffering", 5: "buffering" };
  const touch = () => window.ariaWake?.();
  window.ariaYTLoad = async (id) => {
    if (!/^[\w-]{6,20}$/.test(id)) return;
    box().style.display = "block";
    info.state = "buffering";
    info.error = 0;
    info.position = 0;
    info.duration = 0;
    await ready();
    if (player && player.loadVideoById) { player.loadVideoById(id); return; }
    player = new YT.Player("aria-yt-slot", {
      width: "100%",
      height: "100%",
      videoId: id,
      playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1 },
      events: {
        onReady: (event) => { event.target.playVideo(); },
        onStateChange: (event) => { info.state = names[event.data] || info.state; touch(); },
        onError: (event) => { info.error = event.data; info.state = "error"; touch(); },
      },
    });
  };
  setInterval(() => {
    if (player && player.getCurrentTime) {
      info.position = player.getCurrentTime() || 0;
      info.duration = player.getDuration() || 0;
    }
  }, 400);
  window.ariaYTPlay = () => player && player.playVideo && player.playVideo();
  window.ariaYTPause = () => player && player.pauseVideo && player.pauseVideo();
  window.ariaYTSeek = (seconds) => player && player.seekTo && player.seekTo(Number(seconds), true);
  window.ariaYTVolume = (volume) => player && player.setVolume && player.setVolume(Number(volume));
  window.ariaYTStop = () => {
    try { player && player.stopVideo && player.stopVideo(); } catch {}
    const element = document.getElementById("aria-yt-box");
    if (element) element.style.display = "none";
    info.state = "idle";
    touch();
  };
  window.ariaYTState = () => JSON.stringify(info);
})();
window.ariaEmbed = (id) => {
  if (!/^[\w-]{6,20}$/.test(id)) return;
  document.getElementById("aria-embed")?.remove();
  const box = document.createElement("div");
  box.id = "aria-embed";
  box.style.cssText = "position:fixed;left:12px;right:12px;bottom:132px;max-width:460px;max-height:60vh;margin:0 auto;z-index:9998;background:#000;border:1px solid #262a33;border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.6)";
  const bar = document.createElement("div");
  bar.style.cssText = "display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#16181e;color:#9aa0ab;font:13px system-ui";
  bar.textContent = "Playing in the YouTube player";
  const close = document.createElement("button");
  close.textContent = "Close";
  close.style.cssText = "background:#4f8cff;color:#fff;border:0;border-radius:10px;padding:6px 12px;font:600 13px system-ui;cursor:pointer";
  close.onclick = () => box.remove();
  bar.append(close);
  const frame = document.createElement("iframe");
  frame.src = `https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&rel=0`;
  frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  frame.referrerPolicy = "strict-origin-when-cross-origin";
  frame.style.cssText = "display:block;width:100%;aspect-ratio:16/9;border:0";
  box.append(bar, frame);
  document.body.append(box);
};
window.ariaOpen = (url) => { try { window.open(url, "_blank", "noopener"); } catch {} };
window.ariaHaptic = (ms) => { try { navigator.vibrate?.(Number(ms) || 12); } catch {} };
window.ariaOfflineUrl = async (id) => {
  const cache = await caches.open("aria-offline");
  const response = await cache.match(new Request(`/offline/${id}`));
  return response ? URL.createObjectURL(await response.blob()) : null;
};
window.ariaOfflineDelete = async (id) => {
  await (await caches.open("aria-offline")).delete(new Request(`/offline/${id}`));
  window.ariaStorageRefresh?.();
};
window.ariaOfflineClear = async () => {
  await caches.delete("aria-offline");
  window.ariaStorageRefresh?.();
};
window.ariaInstall = async () => {
  if (!installPrompt) return "unavailable";
  installPrompt.prompt();
  const choice = await installPrompt.userChoice;
  installPrompt = null;
  return choice.outcome;
};
</script>
<style>
html,body{margin:0;height:100%;background:#0e0f13;color:#f2f3f5;font:16px system-ui,sans-serif;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0e0f13;transition:opacity .25s}
#splash img{width:84px;height:84px;border-radius:20px}
#splash i{width:28px;height:28px;border:3px solid #262a33;border-top-color:#4f8cff;border-radius:50%;animation:spin 1s linear infinite}
#splash a,#stage{color:#9aa0ab;font-size:.85rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="aria-canvas"></canvas>
<div id="splash"><img src="/icon-192.png" alt=""><i></i><span id="stage">Starting...</span><a href="/classic">Having trouble? Use the classic version</a></div>
<script type="module">
import { downloadAudio } from "/download.js";
window.ariaDownload = async (id, url, progress) => {
  let lock = null;
  try { lock = await navigator.wakeLock?.request("screen"); } catch {}
  try {
    const size = await downloadAudio({ id, url, progress, cache: await caches.open("aria-offline") });
    window.ariaStorageRefresh?.();
    return size;
  } finally {
    try { await lock?.release(); } catch {}
  }
};
const stage = (text) => { const el = document.getElementById("stage"); if (el) el.textContent = text; };
const classic = (why) => location.replace(`/classic?why=${why}`);
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const within = (promise, ms, label) => Promise.race([promise, sleep(ms).then(() => { throw new Error(`${label} timed out`); })]);
const params = new URLSearchParams(location.search);
const webgl2 = (() => {
  try { return !!document.createElement("canvas").getContext("webgl2"); } catch { return false; }
})();
if (window.__ariaBlocked) {
  document.getElementById("splash")?.remove();
} else if (params.get("ui") === "classic" || typeof WebAssembly !== "object" || !webgl2) {
  classic(params.get("ui") === "classic" ? "chosen" : "unsupported");
} else {
  let running = false;
  window.addEventListener("error", (event) => {
    if (!running && /unreachable|RuntimeError/.test(String(event.message))) classic("crash");
  });
  window.addEventListener("unhandledrejection", (event) => console.error("aria: unhandled", event.reason));
  let holdsLibrary = false;
  if (navigator.locks) {
    await new Promise((resolve) => {
      navigator.locks.request("aria-library", { ifAvailable: true }, (lock) => {
        holdsLibrary = !!lock;
        resolve();
        return lock ? new Promise(() => {}) : undefined;
      });
    });
  } else {
    holdsLibrary = true;
  }
  try {
    stage("Downloading Aria...");
    const { default: init, start, open_library, wake_ui } = await import("/pkg/aria.js");
    window.ariaWake = wake_ui;
    await within(init(), 60000, "download");
    if (holdsLibrary) {
      stage("Opening your library...");
      await within(open_library(), 10000, "library").catch((error) => console.warn("aria: library not saved:", error.message));
    } else {
      console.warn("aria: open in another tab, changes here will not be saved");
    }
    stage("Starting...");
    await within(start("aria-canvas"), 20000, "start");
    running = true;
    const splash = document.getElementById("splash");
    splash.style.opacity = "0";
    setTimeout(() => splash.remove(), 300);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
    window.ariaStorageRefresh?.();
  } catch (error) {
    console.error("aria: failed to load", error);
    if (!running) classic(encodeURIComponent(error.message || "load"));
  }
}
</script>
</body>
</html>
