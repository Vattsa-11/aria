<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aria</title>
<meta name="theme-color" content="#0e0f13">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#0e0f13;color:#f2f3f5;font:16px system-ui,sans-serif;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0e0f13;transition:opacity .25s}
#splash img{width:84px;height:84px;border-radius:20px}
#splash i{width:28px;height:28px;border:3px solid #262a33;border-top-color:#4f8cff;border-radius:50%;animation:spin 1s linear infinite}
#splash a{color:#9aa0ab;font-size:.85rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="aria-canvas"></canvas>
<div id="splash"><img src="/icon-192.png" alt=""><i></i><a href="/classic">Having trouble? Use the classic version</a></div>
<script type="module">
const classic = (why) => location.replace(`/classic?why=${why}`);
const params = new URLSearchParams(location.search);
const webgl2 = (() => {
  try { return !!document.createElement("canvas").getContext("webgl2"); } catch { return false; }
})();
if (params.get("ui") === "classic" || typeof WebAssembly !== "object" || !webgl2) {
  classic(params.get("ui") === "classic" ? "chosen" : "unsupported");
} else {
  let running = false;
  window.addEventListener("error", (event) => {
    if (!running && /unreachable|RuntimeError/.test(String(event.message))) classic("crash");
  });
  if (navigator.locks) {
    navigator.locks.request("aria-library", { ifAvailable: true }, (lock) => {
      if (!lock) { window.__ariaSecondTab = true; return; }
      return new Promise(() => {});
    });
  }
  try {
    const { default: init, start } = await import("/pkg/aria.js");
    await init();
    await start("aria-canvas");
    running = true;
    const splash = document.getElementById("splash");
    splash.style.opacity = "0";
    setTimeout(() => splash.remove(), 300);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  } catch (error) {
    console.error("aria: failed to load", error);
    if (!running) classic("load");
  }
}
</script>
</body>
</html>
