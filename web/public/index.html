<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aria</title>
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aria">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="/gate.js"></script>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
let installPrompt = null;
window.addEventListener("beforeinstallprompt", (event) => { event.preventDefault(); installPrompt = event; });
window.addEventListener("appinstalled", () => { installPrompt = null; });
window.ariaInstallState = () => {
  if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) return "installed";
  if (installPrompt) return "available";
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ? "ios" : "browser";
};
window.ariaStorageRefresh = async () => {
  try {
    const estimate = await navigator.storage.estimate();
    const persisted = await navigator.storage.persisted();
    window.__ariaStorage = JSON.stringify({ usage: estimate.usage || 0, quota: estimate.quota || 0, persisted });
  } catch {}
};
window.ariaRequestPersist = async () => {
  try {
    const granted = await navigator.storage.persist();
    await window.ariaStorageRefresh();
    return granted;
  } catch { return false; }
};
if (navigator.storage?.persist) {
  navigator.storage.persist().finally(() => window.ariaStorageRefresh());
  setInterval(() => window.ariaStorageRefresh(), 5000);
}
window.ariaDownload = async (id, url, progress) => {
  const cache = await caches.open("aria-offline");
  const parts = [];
  let done = 0;
  if (url.startsWith("/api/audio")) {
    let size = 0;
    for (;;) {
      const response = await fetch(url, { headers: { Range: `bytes=${done}-` } });
      if (response.status !== 206 && response.status !== 200) throw new Error(`Server answered ${response.status}`);
      const range = response.headers.get("content-range");
      if (range) size = Number(range.split("/")[1]) || size;
      const chunk = await response.arrayBuffer();
      if (chunk.byteLength === 0) break;
      parts.push(chunk);
      done += chunk.byteLength;
      progress(done, size);
      if (response.status === 200 || (size && done >= size)) break;
    }
  } else {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`Server answered ${response.status}`);
    const size = Number(response.headers.get("content-length")) || 0;
    const reader = response.body.getReader();
    for (;;) {
      const { value, done: finished } = await reader.read();
      if (finished) break;
      parts.push(value);
      done += value.byteLength;
      progress(done, size);
    }
  }
  if (done < 50000) throw new Error("The download came back empty");
  const blob = new Blob(parts, { type: "audio/mp4" });
  await cache.put(new Request(`/offline/${id}`), new Response(blob, { headers: { "content-type": "audio/mp4", "content-length": String(blob.size) } }));
  window.ariaStorageRefresh?.();
  return blob.size;
};
window.ariaOfflineUrl = async (id) => {
  const cache = await caches.open("aria-offline");
  const response = await cache.match(new Request(`/offline/${id}`));
  return response ? URL.createObjectURL(await response.blob()) : null;
};
window.ariaOfflineDelete = async (id) => {
  await (await caches.open("aria-offline")).delete(new Request(`/offline/${id}`));
  window.ariaStorageRefresh?.();
};
window.ariaOfflineClear = async () => {
  await caches.delete("aria-offline");
  window.ariaStorageRefresh?.();
};
window.ariaInstall = async () => {
  if (!installPrompt) return "unavailable";
  installPrompt.prompt();
  const choice = await installPrompt.userChoice;
  installPrompt = null;
  return choice.outcome;
};
</script>
<style>
html,body{margin:0;height:100%;background:#0e0f13;color:#f2f3f5;font:16px system-ui,sans-serif;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0e0f13;transition:opacity .25s}
#splash img{width:84px;height:84px;border-radius:20px}
#splash i{width:28px;height:28px;border:3px solid #262a33;border-top-color:#4f8cff;border-radius:50%;animation:spin 1s linear infinite}
#splash a,#stage{color:#9aa0ab;font-size:.85rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="aria-canvas"></canvas>
<div id="splash"><img src="/icon-192.png" alt=""><i></i><span id="stage">Starting...</span><a href="/classic">Having trouble? Use the classic version</a></div>
<script type="module">
const stage = (text) => { const el = document.getElementById("stage"); if (el) el.textContent = text; };
const classic = (why) => location.replace(`/classic?why=${why}`);
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const within = (promise, ms, label) => Promise.race([promise, sleep(ms).then(() => { throw new Error(`${label} timed out`); })]);
const params = new URLSearchParams(location.search);
const webgl2 = (() => {
  try { return !!document.createElement("canvas").getContext("webgl2"); } catch { return false; }
})();
if (window.__ariaBlocked) {
  document.getElementById("splash")?.remove();
} else if (params.get("ui") === "classic" || typeof WebAssembly !== "object" || !webgl2) {
  classic(params.get("ui") === "classic" ? "chosen" : "unsupported");
} else {
  let running = false;
  window.addEventListener("error", (event) => {
    if (!running && /unreachable|RuntimeError/.test(String(event.message))) classic("crash");
  });
  window.addEventListener("unhandledrejection", (event) => console.error("aria: unhandled", event.reason));
  let holdsLibrary = false;
  if (navigator.locks) {
    await new Promise((resolve) => {
      navigator.locks.request("aria-library", { ifAvailable: true }, (lock) => {
        holdsLibrary = !!lock;
        resolve();
        return lock ? new Promise(() => {}) : undefined;
      });
    });
  } else {
    holdsLibrary = true;
  }
  try {
    stage("Downloading Aria...");
    const { default: init, start, open_library } = await import("/pkg/aria.js");
    await within(init(), 60000, "download");
    if (holdsLibrary) {
      stage("Opening your library...");
      await within(open_library(), 10000, "library").catch((error) => console.warn("aria: library not saved:", error.message));
    } else {
      console.warn("aria: open in another tab, changes here will not be saved");
    }
    stage("Starting...");
    await within(start("aria-canvas"), 20000, "start");
    running = true;
    const splash = document.getElementById("splash");
    splash.style.opacity = "0";
    setTimeout(() => splash.remove(), 300);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
    window.ariaStorageRefresh?.();
  } catch (error) {
    console.error("aria: failed to load", error);
    if (!running) classic(encodeURIComponent(error.message || "load"));
  }
}
</script>
</body>
</html>
