name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: aria-windows-x86_64.exe
            binary: target/release/aria.exe
          - os: ubuntu-latest
            asset: aria-linux-x86_64
            binary: target/release/aria
          - os: macos-latest
            asset: aria-macos-aarch64
            binary: target/release/aria
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Cargo.toml is $version but tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libxkbcommon-dev libwayland-dev libxcb1-dev libgl1-mesa-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        env:
          ARIA_DATA_DIR: ${{ runner.temp }}/aria-test-data
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Stage asset and checksum
        shell: bash
        run: |
          mkdir dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"; else shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"; fi
      - name: Linux tarball
        if: runner.os == 'Linux'
        run: |
          mkdir -p aria-linux-x86_64
          cp target/release/aria packaging/aria.desktop aria-linux-x86_64/
          tar czf dist/aria-linux-x86_64.tar.gz aria-linux-x86_64
          (cd dist && sha256sum aria-linux-x86_64.tar.gz > aria-linux-x86_64.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
