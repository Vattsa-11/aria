name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (needs the tag name below)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  YTDLP_VERSION: "2026.10.26"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            binary: target/release/aria.exe
            raw: aria-windows-x86_64.exe
            ytdlp_asset: yt-dlp.exe
            ytdlp_name: yt-dlp.exe
          - os: ubuntu-latest
            label: linux-x86_64
            binary: target/release/aria
            raw: aria-linux-x86_64
            ytdlp_asset: yt-dlp_linux
            ytdlp_name: yt-dlp
          - os: macos-latest
            label: macos-aarch64
            binary: target/release/aria
            raw: aria-macos-aarch64
            ytdlp_asset: yt-dlp_macos
            ytdlp_name: yt-dlp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Cargo.toml is $version but tag is ${GITHUB_REF_NAME}"; exit 1; }

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libxkbcommon-dev libwayland-dev libxcb1-dev libgl1-mesa-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        env:
          ARIA_DATA_DIR: ${{ runner.temp }}/aria-test-data
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Download and verify yt-dlp
        shell: bash
        run: |
          base="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}"
          curl -fsSL --retry 3 -o ytdlp-download "$base/${{ matrix.ytdlp_asset }}"
          curl -fsSL --retry 3 -o SHA2-256SUMS "$base/SHA2-256SUMS"
          expected=$(grep " ${{ matrix.ytdlp_asset }}\$" SHA2-256SUMS | cut -d' ' -f1)
          if command -v sha256sum >/dev/null; then actual=$(sha256sum ytdlp-download | cut -d' ' -f1); else actual=$(shasum -a 256 ytdlp-download | cut -d' ' -f1); fi
          test -n "$expected" || { echo "no checksum listed for ${{ matrix.ytdlp_asset }}"; exit 1; }
          test "$expected" = "$actual" || { echo "yt-dlp checksum mismatch: $expected vs $actual"; exit 1; }
          chmod +x ytdlp-download

      - name: Stage files
        shell: bash
        run: |
          mkdir -p dist bundle
          cp "${{ matrix.binary }}" "dist/${{ matrix.raw }}"
          cp "${{ matrix.binary }}" bundle/
          cp ytdlp-download "bundle/${{ matrix.ytdlp_name }}"
          if [ "$RUNNER_OS" = "Linux" ]; then cp packaging/aria.desktop assets/icon-256.png bundle/; fi

      - name: Windows zip
        if: runner.os == 'Windows'
        shell: bash
        run: (cd bundle && 7z a -tzip "../dist/aria-windows-x86_64.zip" .)

      - name: Unix tarball
        if: runner.os != 'Windows'
        shell: bash
        run: (cd bundle && tar czf "../dist/aria-${{ matrix.label }}.tar.gz" .)

      - name: Windows MSI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 4.0.5
          export PATH="$PATH:$HOME/.dotnet/tools"
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          wix build packaging/windows/aria.wxs -arch x64 \
            -d "Version=$version" \
            -d "ExePath=$(pwd)/bundle/aria.exe" \
            -d "YtdlpPath=$(pwd)/bundle/yt-dlp.exe" \
            -d "IconPath=$(pwd)/assets/icon.ico" \
            -o dist/aria-windows-x86_64.msi

      - name: Debian package
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --output dist/aria-linux-amd64.deb

      - name: Checksums
        shell: bash
        run: |
          cd dist
          for file in *; do
            case "$file" in *.sha256) continue;; esac
            if command -v sha256sum >/dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: aria-${{ matrix.label }}
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          store="$RUNNER_TEMP/aria.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$store"
            password="$KEYSTORE_PASSWORD"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a temporary key. Updates will not install over earlier builds."
            password="aria-temporary-key"
            keytool -genkeypair -keystore "$store" -alias aria -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$password" -keypass "$password" -dname "CN=Aria,O=Aria,C=IN"
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$store" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cargo apk build --release --lib
      - name: Stage APK
        run: |
          mkdir dist
          cp target/release/apk/aria.apk dist/aria-android-arm64.apk
          cd dist && sha256sum aria-android-arm64.apk > aria-android-arm64.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aria-android-arm64
          path: dist/*

  publish:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
      - name: Combined checksum list
        run: cd dist && cat *.sha256 > SHA256SUMS.txt
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -e "s/{{VERSION}}/$version/g" -e "s/{{YTDLP}}/${YTDLP_VERSION}/g" packaging/release-notes.md > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
