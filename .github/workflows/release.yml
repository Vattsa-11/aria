name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows_only:
        description: "Trial run: build only the Windows files, publish nothing"
        type: boolean
        default: true

permissions:
  contents: write

env:
  YTDLP_VERSION: "2026.10.26"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          WINDOWS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_only }}
        run: |
          windows='{"os":"windows-latest","label":"windows-x86_64","binary":"target/release/aria.exe","raw":"aria-windows-x86_64.exe","ytdlp_asset":"yt-dlp.exe","ytdlp_name":"yt-dlp.exe","features":"--features embed-ytdlp"}'
          linux='{"os":"ubuntu-latest","label":"linux-x86_64","binary":"target/release/aria","raw":"aria-linux-x86_64","ytdlp_asset":"yt-dlp_linux","ytdlp_name":"yt-dlp","features":""}'
          macos='{"os":"macos-latest","label":"macos-aarch64","binary":"target/release/aria","raw":"aria-macos-aarch64","ytdlp_asset":"yt-dlp_macos","ytdlp_name":"yt-dlp","features":""}'
          if [ "$WINDOWS_ONLY" = "true" ]; then
            echo "matrix={\"include\":[$windows]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$windows,$linux,$macos]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Cargo.toml is $version but tag is ${GITHUB_REF_NAME}"; exit 1; }

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libxkbcommon-dev libwayland-dev libxcb1-dev libgl1-mesa-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        env:
          ARIA_DATA_DIR: ${{ runner.temp }}/aria-test-data
        run: cargo test

      - name: Download and verify yt-dlp
        shell: bash
        run: |
          base="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}"
          curl -fsSL --retry 3 -o ytdlp-download "$base/${{ matrix.ytdlp_asset }}"
          curl -fsSL --retry 3 -o SHA2-256SUMS "$base/SHA2-256SUMS"
          expected=$(grep " ${{ matrix.ytdlp_asset }}\$" SHA2-256SUMS | cut -d' ' -f1)
          if command -v sha256sum >/dev/null; then actual=$(sha256sum ytdlp-download | cut -d' ' -f1); else actual=$(shasum -a 256 ytdlp-download | cut -d' ' -f1); fi
          test -n "$expected" || { echo "no checksum listed for ${{ matrix.ytdlp_asset }}"; exit 1; }
          test "$expected" = "$actual" || { echo "yt-dlp checksum mismatch: $expected vs $actual"; exit 1; }
          chmod +x ytdlp-download
          if [ "$RUNNER_OS" = "Windows" ]; then mkdir -p bundled && cp ytdlp-download bundled/yt-dlp.exe; fi

      - name: Build
        run: cargo build --release ${{ matrix.features }}

      - name: Stage files
        shell: bash
        run: |
          mkdir -p dist bundle
          cp "${{ matrix.binary }}" "dist/${{ matrix.raw }}"
          cp "${{ matrix.binary }}" bundle/
          cp ytdlp-download "bundle/${{ matrix.ytdlp_name }}"
          if [ "$RUNNER_OS" = "Linux" ]; then cp packaging/aria.desktop assets/icon-256.png bundle/; fi

      - name: Windows zip
        if: runner.os == 'Windows'
        shell: bash
        run: (cd bundle && 7z a -tzip "../dist/aria-windows-x86_64.zip" .)

      - name: Unix tarball
        if: runner.os != 'Windows'
        shell: bash
        run: (cd bundle && tar czf "../dist/aria-${{ matrix.label }}.tar.gz" .)

      - name: Windows MSI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 4.0.5
          export PATH="$PATH:$HOME/.dotnet/tools"
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          wix build packaging/windows/aria.wxs -arch x64 \
            -d "Version=$version" \
            -d "ExePath=$(pwd)/bundle/aria.exe" \
            -d "YtdlpPath=$(pwd)/bundle/yt-dlp.exe" \
            -d "IconPath=$(pwd)/assets/icon.ico" \
            -o dist/aria-windows-x86_64.msi

      - name: Debian package
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --output dist/aria-linux-amd64.deb

      - name: Checksums
        shell: bash
        run: |
          cd dist
          for file in *; do
            case "$file" in *.sha256) continue;; esac
            if command -v sha256sum >/dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: aria-${{ matrix.label }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
      - name: Combined checksum list
        run: cd dist && cat *.sha256 > SHA256SUMS.txt
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -e "s/{{VERSION}}/$version/g" -e "s/{{YTDLP}}/${YTDLP_VERSION}/g" packaging/release-notes.md > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
