name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libxkbcommon-dev libwayland-dev libxcb1-dev libgl1-mesa-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        env:
          ARIA_DATA_DIR: ${{ runner.temp }}/aria-test-data
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: clang for the wasm SQLite build
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
      - uses: Swatinem/rust-cache@v2
      - name: Web build compiles
        run: cargo check --target wasm32-unknown-unknown --lib
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker type check and tests
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
