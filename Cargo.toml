[package]
name = "aria"
version = "0.1.0"
edition = "2021"
description = "Lightweight touch-first Windows desktop music player"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "persistence", "x11", "wayland"] }
egui = "0.37"
rodio = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
rusqlite = { version = "0.41", features = ["bundled"] }
ureq = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
souvlaki = "0.9"
des = "0.8"
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
