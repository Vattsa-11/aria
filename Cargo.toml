[package]
name = "aria"
version = "1.0.2"
edition = "2021"
description = "Lightweight touch-first Windows desktop music player"

[lib]
name = "aria"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aria"
path = "src/main.rs"

[features]
embed-ytdlp = []

[build-dependencies]
embed-resource = "3"

[dependencies]
web-time = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "persistence", "clipboard", "x11", "wayland"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
des = "0.8"
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = { version = "0.23", features = ["symphonia-all"] }
rusqlite = { version = "0.41", features = ["bundled"] }
ureq = "3"
souvlaki = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite = "0.41"
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = "0.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Navigator", "HtmlCanvasElement", "HtmlAudioElement", "Storage", "Response", "Request", "Headers", "console"] }
js-sys = "0.3"

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
rfd = "0.17"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "persistence", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }

[package.metadata.android]
package = "com.magi8101.aria"
build_targets = ["aarch64-linux-android"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Aria"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[package.metadata.deb]
name = "aria-player"
maintainer = "magi8101"
copyright = "magi8101"
section = "sound"
priority = "optional"
depends = "$auto"
recommends = "ffmpeg"
extended-description = "Touch-first music player for local files and streaming from YouTube, YouTube Music and JioSaavn."
assets = [
    ["target/release/aria", "usr/bin/", "755"],
    ["packaging/aria.desktop", "usr/share/applications/", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/aria.png", "644"],
    ["ytdlp-download", "usr/lib/aria/yt-dlp", "755"],
]
